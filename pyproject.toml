[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "soundreg"
version = "0.1.0"
description = "Autoregressive acoustic object detection (SoundReg)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["soundreg*"]
