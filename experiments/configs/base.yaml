# Base config: synthetic data, SoundReg with the spectrogram CNN encoder.
# Experiment configs inherit via `_base_: base.yaml` and override.

exp_name: base

data:
  dataset: synthetic          # synthetic | real (M1)
  features: [logmag_ipd]      # subset of {logmag_ipd, srp}; must cover model.input
  ordering: dominance         # dominance | near_to_far | azimuth | random | oracle_energy | oracle_snr
  srp_bands: 4
  seed: 0                     # dataset seed (independent of training seed)
  n_train: 2000
  n_val: 300
  n_test: 600
  array: {type: circular, n_mics: 8, radius_m: 0.5, z_m: 0.0}
  audio: {fs: 16000, n_fft: 256, src_z: 1.0}
  sim:
    n_frames: 24
    n_sources_min: 1
    n_sources_max: 5
    r_min_m: 2.0
    r_max_m: 28.0
    min_separation_m: 2.0
    dominance_spread_db: 25.0   # masking pressure: per-scene level spread
    scene_snr_db: [5.0, 20.0]
    bandwidth_hz: [300.0, 1500.0]
    support_threshold: 0.1
    n_classes: 1
    nlos_prob: 0.0
    nlos_extra_atten_db: 10.0

grid: {n_r: 24, n_theta: 72, r_max: 30.0}   # azimuth finer than range (5 deg / 1.25 m)

model:
  name: soundreg              # soundreg | heatmap | srp_peaks
  max_objects: 8
  encoder:
    name: spectro_cnn         # spectro_cnn | polar_srp
    d_model: 192
    channels: [64, 128, 192]
  decoder:
    d_model: 192
    n_layers: 4
    n_heads: 6
    d_ff: 768
    dropout: 0.1
    context_mode: full        # full | object_only (conditioning ablation)
    tie_embeddings: true
  loss:
    soft_sigma_bins: 0.0      # >0 enables Gaussian soft targets for r/theta

training:
  seed: 0
  epochs: 30
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_frac: 0.05
  grad_clip: 1.0
  amp: false
  num_workers: 0
  device: auto

eval:
  dist_thresh_m: 2.0
  decode: {mode: greedy}
  snr_edges: [-30, -10, -5, 0, 5, 10, 40]
